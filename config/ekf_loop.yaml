/**/ekf_local:
  ros__parameters:
    frequency: 15.0
    two_d_mode: false
    publish_tf: true

    map_frame: "icp_map"
    odom_frame: "ekf_odom"
    base_link_frame: "base_link"
    world_frame: "ekf_odom"

    # IMU (Angular Velocity & Linear Accel)
    imu0: "/dvl/imu"
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  true,  true,  true,
                  false,  false,  false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    # imu0_pose_rejection_threshold: 0.8      
    # imu0_twist_rejection_threshold: 0.8


    # DVL (Linear Velocity)
    twist0: "/dvl/velocity"
    twist0_config: [false, false, false,
                    false, false, false,
                    true,  true,  false,   # X, Y, Z velocities
                    false, false, false,
                    false, false, false]
    twist0_rejection_threshold: 2.0


