/**/ekf_gps:
  ros__parameters:
    frequency: 10.0
    two_d_mode: true
    publish_tf: false

    map_frame: "icp_map"
    odom_frame: "gps_odom"
    base_link_frame: "base_link"
    world_frame: "icp_map"

    odom0: "odometry/gps_ned"         
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative:     false
    odom0_rejection_threshold: 2.0

    imu0: "/dvl/imu"
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  true,  true,  true,
                  false,  false,  false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true


    twist0: "/dvl/velocity"
    twist0_config: [false, false, false,
                    false, false, false,
                    true,  true,  false,
                    false, false, false,
                    false, false, false]
    twist0_rejection_threshold: 2.0

/navsat_transform_node:
  ros__parameters:
    use_sim_time: true
    frequency: 10.0
    delay: 0.0
    magnetic_declination_radians: 0.13 # Change this based on your city (e.g., 0.21 for NYC)
    yaw_offset: 1.57      # IMU reads 0 at North? If not, adjust (1.57 is 90 deg)
    zero_altitude: true              # Use if you only care about XY movement
    publish_filtered_gps: true       # Useful for debugging on a map
    broadcast_cartesian_transform: false
    use_odometry_yaw: true           # use EKF heading instead of IMU orientation
    wait_for_datum: false


