ekf_local:
  ros__parameters:
    frequency: 5.0
    two_d_mode: false
    publish_tf: false

    map_frame: "odom"
    odom_frame: "ekf_odom"
    base_link_frame: "sam_auv_v1/base_link"
    world_frame: "ekf_odom"   


    # IMU (Angular Velocity & Linear Accel)
    imu0: "/imu/data"
    imu0_config: [false, false, false,
                  true, true, false,
                  false, false, false,
                  false,  false,  true,   # Roll, Pitch, Yaw velocities
                  false,  false,  false]   # X, Y, Z accelerations
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true


    # DVL (Linear Velocity)
    twist0: "/dvl"
    twist0_config: [false, false, false,
                    false, false, false,
                    true,  true,  false,   # X, Y, Z velocities
                    false, false, false,
                    false, false, false]


ekf_global:
  ros__parameters:
    frequency: 5.0
    two_d_mode: false
    publish_tf: false

    map_frame: "odom"
    odom_frame: "ekf_odom"
    base_link_frame: "sam_auv_v1/base_link"
    world_frame: "odom"

    imu0: "/imu/data"
    imu0_config: [false, false, false,
                  true, true, false,
                  false, false, false,
                  false,  false,  true,
                  false,  false,  false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    twist0: "/dvl"
    twist0_config: [false, false, false,
                    false, false, false,
                    true,  true,  false,
                    false, false, false,
                    false, false, false]


    # PLUS THE ABSOLUTE DEPTH
    pose0: "/depth_odom"
    pose0_config: [false, false, true,    
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
