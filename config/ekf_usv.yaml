ekf_local:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: false

    map_frame: "map"
    odom_frame: "odom"
    base_link_frame: "imu_link_ned"
    world_frame: "odom"    

    # IMU (Angular Velocity & Linear Accel)
    # imu0: "/imu/data_cov"
    # imu0_config: [false, false, false,
    #               false, false, true,
    #               false,  false,  false,
    #               false,  false,  false]
    # imu0_differential: false
    # imu0_relative: true
    # imu0_remove_gravitational_acceleration: true
    # imu0_pose_rejection_threshold: 0.8      
    # imu0_twist_rejection_threshold: 0.8


    # DVL (Linear Velocity)
    # twist0: "/dvl"
    # twist0_config: [false, false, false,
    #                 false, false, false,
    #                 true,  true,  false,   # X, Y, Z velocities
    #                 false, false, false,
    #                 false, false, false]



    # GPS position from navsat_transform_node (absolute x, y in odom frame)
    odom0: odometry/gps
    odom0_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    odom1: imu/odometry
    odom1_config: [false, false, false,
                   false, false, true,
                   false,  false,  false,   # X, Y, Z positions
                   false, false, false,           
                    false, false, false]
    odom1_differential: false
    odom1_relative: false

navsat_transform:
  ros__parameters:
    use_sim_time: true
    frequency: 10.0
    delay: 0.0
    magnetic_declination_radians: 0.13 # Change this based on your city (e.g., 0.21 for NYC)
    yaw_offset: 0.0       # IMU reads 0 at North? If not, adjust (1.57 is 90 deg)
    zero_altitude: true              # Use if you only care about XY movement
    publish_filtered_gps: true       # Useful for debugging on a map
    broadcast_cartesian_transform: true
    use_odometry_yaw: false
    wait_for_datum: false

# smooth_lagged_data: true
# history_length: 1.0