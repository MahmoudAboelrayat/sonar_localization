localization_imu_pre:
  ros__parameters:
    is_ned: false
    ekf_z: true
    loop_ekf_z: true
    ekf_max_age: 0.1

    topics:
      odom_pub: "vgicp_odom"
      pc_sub: "/sonar/point_cloud"
      deadreckoining_sub: "/odometry/filtered"
      map_pub: "vgicp_global_map"
      imu_sub: "/dvl/imu"
      dvl_sub: "/dvl/velocity"
      ahrs_sub: "/dvl/ahrs_imu"

    tuning:
      map_res: 0.05
      vgicp_threads: 8
      vgicp_epsilon: 1e-4
      vgicp_max_dist: 1.0
      vgicp_max_iter: 100
      vgicp_resolution: 0.05
      max_lost_frames: 40

    radius_outlier_removal:
      filter_radius_outliers: true
      radius_search: 0.2
      min_neighbors_in_radius: 30

    outlier_removal:
      filter_outliers: true
      num_neighbors: 30
      stddev_mul_thresh: 0.7

    intensity_filter:
      filter_intensity: false
      min_intensity: 0.005

    tf:
      sonar2base_x: -0.109
      sonar2base_y: -0.037
      sonar2base_z: 0.168
      sonar2base_roll: 0.0
      sonar2base_pitch: 22.5   # degrees (- down / + up)
      sonar2base_yaw: 0.0

      # IMU mounting — rotation from IMU frame to base_link
      imu2base_roll:  0.0      # degrees
      imu2base_pitch: 0.0
      imu2base_yaw:   0.0
      # IMU lever arm — translation from base_link to IMU in base_link frame
      imu2base_x: 0.0          # meters
      imu2base_y: 0.0
      imu2base_z: 0.0

      # DVL lever arm — translation from base_link to dvl_link in body frame
      # Used to remove the ω×r velocity component from DVL readings.
      # Set to (0,0,0) to disable correction.
      dvl2base_x: 0.0          # meters
      dvl2base_y: 0.107
      dvl2base_z: -0.265

    keyframe:
      submap_size: 30
      dist_thresh: 0.3
      angle_thresh: 3.0        # degrees

    loop_closure:
      use_lc: false
      search_radius: 4.0
      fitness_score: 0.2
      history_gap: 20
      submap_size: 10
      vgicp_epsilon: 1e-4
      vgicp_max_dist: 1.0
      vgicp_max_iter: 100
      vgicp_resolution: 0.05
      use_ndt: false
      ndt_resolution: 1.0
      ndt_step_size: 1.0
      ndt_max_iter: 150
      ndt_epsilon: 0.01

    gtsam:
      odom_noise_x: 0.0120
      odom_noise_y: 0.0120
      odom_noise_z: 0.001
      odom_noise_roll: 0.001
      odom_noise_pitch: 0.001
      odom_noise_yaw: 0.0125

    imu:
      use_imu: false            # set true to enable IMU preintegration
      start_kf: 10              # keyframes to wait before activating ImuFactor (GICP warms up first)
      accel_noise: 0.5         # accelerometer white noise [m/s^2/sqrt(Hz)]
      gyro_noise:  0.005        # gyroscope white noise [rad/s/sqrt(Hz)]
      accel_bias_noise: 1.0e-3  # accelerometer bias random walk (loosened for faster convergence)
      gyro_bias_noise:  1.0e-3  # gyroscope bias random walk (loosened for faster convergence)
      gravity: 9.81
     
      static_accel_bias_x:  -0.02  # m/s^2 — measured resting a_x
      static_accel_bias_y:  0.0   # m/s^2 — measured resting a_y (primary Y drift source)
      static_accel_bias_z:  0.0    # m/s^2 — Z is dominated by gravity, leave to GTSAM
      static_gyro_bias_x:   0.0    # rad/s
      static_gyro_bias_y:   0.0    # rad/s
      static_gyro_bias_z:   0.00 # rad/s — measured resting omega_z (primary rotation drift)

    ahrs:
      use_ahrs: false           # set true to enable AHRS roll+pitch factor
      noise_rp:  0.001          # sigma [rad] for roll and pitch (~1°)
      noise_yaw: 0.1            # sigma [rad] for yaw (~6°) — reserved for future use

    dvl:
      use_dvl: true            # set true to enable DVL velocity factor
      noise_x: 0.001             # [m/s]
      noise_y: 0.001
      noise_z: 0.05

    frames:
      odom_frame: "icp_map"
      base_frame: "saabmarine/base_link"
