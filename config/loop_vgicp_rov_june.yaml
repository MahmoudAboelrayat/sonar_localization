odom_vgicp:
  ros__parameters:
    is_ned: false
    ekf_z: true
    loop_ekf_z: true
    ekf_max_age: 0.1

    topics:
      odom_pub: "vgicp_odom"
      pc_sub: "sonar/point_cloud"
      deadreckoining_sub: "odometry/filtered"
      map_pub: "vgicp_sub_map"
   
    tuning:
      map_res: 0.2   
      vgicp_threads: 8   
      vgicp_epsilon: 1e-4
      vgicp_max_dist: 1.5 
      vgicp_max_iter: 100    
      vgicp_resolution: 0.3
      max_lost_frames: 40

    radius_outlier_removal:
      filter_radius_outliers: true
      radius_search: 0.2
      min_neighbors_in_radius: 30

    outlier_removal:
      filter_outliers: true
      num_neighbors: 30
      stddev_mul_thresh: 0.7
      # stddev_mul_thresh: 1.0

    intensity_filter:
      filter_intensity: false
      min_intensity: 0.005

    

    tf:
      base2sonar_x: 0.163
      base2sonar_y: 0.1437
      base2sonar_z: -0.3794
      base2sonar_roll: 0.0
      base2sonar_pitch: -20.0   # degrees (- down / + up)
      base2sonar_yaw: 0.0

    keyframe:
      submap_size:   30      
      dist_thresh:   0.5
      angle_thresh:  8.0    # degrees 
      min_dt: 0.3


    loop_closure:
      search_radius: 15.0
      fitness_score: 0.7 #0.7
      history_gap: 20
      submap_size: 10
      vgicp_epsilon: 1e-4
      vgicp_max_dist: 0.8 #working 3.0
      vgicp_max_iter: 100
      vgicp_resolution: 0.3
      # NDT alternative (better for large drift at loop closure)
      use_ndt:        false
      ndt_resolution: 1.0   # voxel cell size [m]
      ndt_step_size:  1.0
      ndt_max_iter:   150
      ndt_epsilon:    0.01

    gtsam:
      odom_noise_x: 0.0120
      odom_noise_y: 0.0120
      odom_noise_z: 0.001
      odom_noise_roll: 0.001
      odom_noise_pitch: 0.001
      odom_noise_yaw: 0.0125

    frames:
      odom_frame: "icp_map"
      base_frame: "base_link"