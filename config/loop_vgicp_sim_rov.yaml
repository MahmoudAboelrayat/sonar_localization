loopclosure_vgicp:
  ros__parameters:
    is_ned: false
    ekf_z: true
    loop_ekf_z: true
    ekf_max_age: 0.2
    topics:
      odom_pub: "vgicp_odom"
      pc_sub: "/sonar/point_cloud_noisy"
      # pc_sub: "/sonar/point_cloud_local"
      deadreckoining_sub: "/odometry/filtered"
      map_pub: "vgicp_global_map"

    tuning:
      map_res: 0.2   
      vgicp_threads: 6     
      vgicp_epsilon: 1e-4
      vgicp_max_dist: 4.5
      vgicp_max_iter: 100  
      vgicp_resolution: 0.25

    loop_closure:
      search_radius: 15.0
      fitness_score: 0.4
      history_gap: 30
      submap_size: 30
      vgicp_epsilon: 1e-4
      vgicp_max_dist: 2.0 
      vgicp_max_iter: 100  
      vgicp_resolution: 0.3


    tf:
      base2sonar_x: 0.039
      base2sonar_y: 0.000
      base2sonar_z: 0.083
      base2sonar_roll: 0.0
      base2sonar_pitch: 30.0  # degrees (- down / + up)
      base2sonar_yaw: 0.0

    # keyframe:
    #   submap_size:   30      
    #   dist_thresh:   1.0   
    #   angle_thresh:  10.0    # degrees 
    keyframe:
      submap_size:  30      
      dist_thresh:   0.5     
      angle_thresh:  5.0    # degrees 
    gtsam:
      odom_noise_roll: 0.1
      odom_noise_pitch: 0.1
      odom_noise_yaw: 0.3
      odom_noise_x: 0.5
      odom_noise_y: 0.5
      odom_noise_z: 0.3
      lc_noise_roll: 0.01
      lc_noise_pitch: 0.01
      lc_noise_yaw: 0.01
      lc_noise_x: 0.05
      lc_noise_y: 0.05
      lc_noise_z: 0.05
      lc_huber_k: 1.0

    frames:
      odom_frame: "odom"
      base_frame: "BlueROV2_Heavy/base_link"