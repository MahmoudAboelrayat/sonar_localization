/**:
  ros__parameters:
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: 0.13
    yaw_offset: 0.0         # offset if IMU x-axis ≠ East
    zero_altitude: true      # ignore GPS altitude if unreliable
    broadcast_utm_transform: true   # must be true so navsat can publish the utm→odom tf
    publish_filtered_gps: true
    use_odometry_yaw: false  # true = use EKF yaw instead of IMU for heading
    wait_for_datum: false
    world_frame: icp_map        # must match frame_id in /odometry/filtered