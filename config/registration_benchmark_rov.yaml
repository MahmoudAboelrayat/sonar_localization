vgicp_odom_node:
  ros__parameters:
    is_ned: false
    ekf_z: true
    ekf_fallback: true          # publish EKF-predicted pose when registration fails

    topics:
      odom_pub: "vgicp_odom"
      pc_sub: "/sonar/point_cloud"
      deadreckoining_sub: "/odometry/filtered"
      map_pub: "vgicp_global_map"
      history_map_pub: "vgicp_full_map"
      filtered_pc_pub: "filtered_cloud"

    registration:
      method: "VGICP"   # VGICP | GICP | ICP | NDT | ICPNL

    tuning:
      map_res: 0.2
      vgicp_threads: 8
      vgicp_epsilon: 1e-4
      vgicp_max_dist: 3.0
      vgicp_max_iter: 100
      vgicp_resolution: 0.3
      max_lost_frames: 40
      ndt_resolution: 1.0
      ndt_step_size: 1.0
      ndt_max_iter: 150
      ndt_epsilon: 0.01
      normal_k_search: 20

    radius_outlier_removal:
      filter_radius_outliers: true
      radius_search: 0.2
      min_neighbors: 30

    outlier_removal:
      filter_outliers: true
      num_neighbors: 30
      stddev_mul_thresh: 0.7

    intensity_filter:
      filter_intensity: false
      min_intensity: 0.005

    tf:
      sonar2base_x: -0.111
      sonar2base_y: 0.000
      sonar2base_z: 0.249
      sonar2base_roll: 0.0
      sonar2base_pitch: 30.0   # degrees (- down / + up)
      sonar2base_yaw: 0.0

    keyframe:
      submap_size: 30
      dist_thresh: 1.0
      angle_thresh: 8.0        # degrees

    frames:
      odom_frame: "icp_map"
      base_frame: "saabmarine/base_link"
