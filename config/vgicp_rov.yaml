fastvgicp_odom:
  ros__parameters:
    is_ned: false
    ekf_z: true
    topics:
      odom_pub: "vgicp_odom"
      pc_sub: "/sonar/point_cloud_intensity"
      ekf_sub: "/odometry/filtered"
      map_pub: "vgicp_global_map"
      
    tuning:
      map_res: 0.2    
      vgicp_threads: 4   
      vgicp_epsilon: 1e-4
      vgicp_max_dist: 1.25
      vgicp_max_iter: 100    
      vgicp_resolution: 0.2

    outlier_removal:
      filter_outliers: true
      num_neighbors: 30
      stddev_mul_thresh: 0.75

    intensity_filter:
      filter_intensity: false
      min_intensity: 0.01
    
    tf:
      sonar2base_x: -0.111
      sonar2base_y: 0.000
      sonar2base_z: 0.249
      sonar2base_roll: 0.0
      sonar2base_pitch: 34.0  # degrees (- down / + up)
      sonar2base_yaw: 0.0

    keyframe:
      submap_size:   30      
      dist_thresh:   0.5   
      angle_thresh:  5.0    # degrees 

    frames:
      odom_frame: "Beckholmen"
      base_frame: "saabmarine/base_link"